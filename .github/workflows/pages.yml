name: Publish Pocket to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate financial calculations
        run: node --test tests/*.test.mjs
      - name: Validate Bank of Taiwan parser
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Refresh Bank of Taiwan USD spot-buy rate
        run: python3 scripts/update_fx.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
